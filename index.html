<script>

let waescheListe = [];

try {
    waescheListe =
    JSON.parse(localStorage.getItem("waescheListe")) || [];
}
catch(e){
    localStorage.removeItem("waescheListe");
    waescheListe = [];
}

temperaturVorschlag();
anzeigen();

function temperaturVorschlag(){

const programm =
document.getElementById("programm").value;

const temp =
document.getElementById("temperatur");

if(programm.includes("60"))
temp.value = "60°C";

else if(programm.includes("40"))
temp.value = "40°C";

else
temp.value = "30°C";

}

function getIcon(kategorie){

switch(kategorie){

case "T-Shirts":
return "👕";

case "Hemden":
return "👔";

case "Hosen":
return "👖";

case "Jacken":
return "🧥";

case "Sportbekleidung":
return "🏃";

case "Bettwäsche":
return "🛏️";

case "Handtücher":
return "🛁";

default:
return "🧺";

}

}

function speichern(){

const file =
document.getElementById("bild").files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

eintragSpeichern(
e.target.result
);

};

reader.readAsDataURL(file);

}
else{

eintragSpeichern("");

}

}

function eintragSpeichern(bild){

const teil = {

name:
document.getElementById("name").value.trim(),

kategorie:
document.getElementById("kategorie").value,

programm:
document.getElementById("programm").value,

temperatur:
document.getElementById("temperatur").value,

hinweis:
document.getElementById("hinweis").value,

bild:
bild,

favorit:
false

};

if(teil.name === ""){

alert("Bitte Wäschestück eingeben");
return;

}

waescheListe.push(teil);

localStorage.setItem(
"waescheListe",
JSON.stringify(waescheListe)
);

document.getElementById("name").value = "";
document.getElementById("hinweis").value = "";
document.getElementById("bild").value = "";

anzeigen();

}

function favorit(index){

waescheListe[index].favorit =
!waescheListe[index].favorit;

localStorage.setItem(
"waescheListe",
JSON.stringify(waescheListe)
);

anzeigen();

}
