<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Waschprogramme</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
max-width:800px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,textarea,button{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
background:#007AFF;
color:white;
border:none;
cursor:pointer;
}

.listeEintrag{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.favorit{
background:gold;
color:black;
}

.loeschen{
background:red;
color:white;
}

</style>
</head>
<body>

<h1>🧺 Waschprogramme</h1>

<div class="card">

<input id="suche" placeholder="Suche..." onkeyup="anzeigen()">

<input id="name" placeholder="Wäschestück">

<select id="programm">
<option>Baumwolle 60°C</option>
<option>Baumwolle 40°C</option>
<option>Pflegeleicht 40°C</option>
<option>Pflegeleicht 30°C</option>
<option>Feinwäsche</option>
<option>Wolle</option>
</select>

<textarea id="hinweis" placeholder="Hinweis"></textarea>

<button onclick="speichern()">
Speichern
</button>

</div>

<div id="liste"></div>

<script>

let daten =
JSON.parse(localStorage.getItem("waesche")) || [];

anzeigen();

function speichern(){

const name =
document.getElementById("name").value.trim();

if(name===""){
alert("Bitte Wäschestück eingeben");
return;
}

daten.push({

name:name,
programm:document.getElementById("programm").value,
hinweis:document.getElementById("hinweis").value,
favorit:false

});

localStorage.setItem(
"waesche",
JSON.stringify(daten)
);

document.getElementById("name").value="";
document.getElementById("hinweis").value="";

anzeigen();

}

function favorit(index){

daten[index].favorit =
!daten[index].favorit;

localStorage.setItem(
"waesche",
JSON.stringify(daten)
);

anzeigen();

}

function loeschen(index){

if(confirm("Eintrag löschen?")){

daten.splice(index,1);

localStorage.setItem(
"waesche",
JSON.stringify(daten)
);

anzeigen();

}

}

function anzeigen(){

const suche =
document.getElementById("suche")
.value.toLowerCase();

const liste =
document.getElementById("liste");

liste.innerHTML="";

daten.forEach((eintrag,index)=>{

if(
!eintrag.name.toLowerCase().includes(suche)
&&
!eintrag.programm.toLowerCase().includes(suche)
){
return;
}

liste.innerHTML += `

<div class="listeEintrag">

<h3>${eintrag.name}</h3>

<p><b>Programm:</b> ${eintrag.programm}</p>

<p>${eintrag.hinweis}</p>

<button
class="favorit"
onclick="favorit(${index})">

${eintrag.favorit ? "⭐ Favorit" : "☆ Favorit"}

</button>

<br><br>

<button
class="loeschen"
onclick="loeschen(${index})">

🗑 Löschen

</button>

</div>

`;

});

}

</script>

</body>
</html>
